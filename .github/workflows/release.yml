name: Release browser extensions

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out tag
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Verify release version
        shell: bash
        run: |
          package_version="$(bun -e "console.log(require('./package.json').version)")"
          tag_version="${GITHUB_REF_NAME#v}"

          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag version ($tag_version) does not match package.json ($package_version)."
            exit 1
          fi

          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check project
        run: |
          bun run typecheck
          bun run test

      - name: Build browser packages
        run: bun run release:build

      - name: Verify release assets
        shell: bash
        run: |
          for asset in \
            ".output/chatgpt-switch-${PACKAGE_VERSION}-chrome.zip" \
            ".output/chatgpt-switch-${PACKAGE_VERSION}-edge.zip" \
            ".output/chatgpt-switch-${PACKAGE_VERSION}-firefox.zip" \
            ".output/chatgpt-switch-${PACKAGE_VERSION}-sources.zip"; do
            test -f "$asset" || { echo "Missing release asset: $asset"; exit 1; }
          done

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            ".output/chatgpt-switch-${PACKAGE_VERSION}-chrome.zip"
            ".output/chatgpt-switch-${PACKAGE_VERSION}-edge.zip"
            ".output/chatgpt-switch-${PACKAGE_VERSION}-firefox.zip"
            ".output/chatgpt-switch-${PACKAGE_VERSION}-sources.zip"
          )

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            prerelease=()
            if [[ "$PACKAGE_VERSION" == *-* ]]; then
              prerelease+=(--prerelease)
            fi

            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              --title "ChatGPT Switch $GITHUB_REF_NAME" \
              "${prerelease[@]}"
          fi
